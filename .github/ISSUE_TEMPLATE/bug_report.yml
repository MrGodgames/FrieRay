name: Bug report
description: Report a reproducible problem in FrieRay
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include real subscription URLs, UUIDs, passwords, access tokens, generated Xray configs, or provider account data.

  - type: input
    id: version
    attributes:
      label: FrieRay version
      description: "Example: v0.2.3"
      placeholder: v0.2.3
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 14.5 / 15.0
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: CPU architecture
      options:
        - Apple Silicon
        - Intel
        - Other / unknown
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Subscription import
        - Server list / selection
        - Connection lifecycle
        - System proxy
        - TUN mode
        - Tray / menu bar
        - Logs / diagnostics
        - UI / theme
        - Build / development
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use redacted examples only.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove subscription URLs, credentials, UUIDs, tokens, server addresses if private, and generated configs.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private subscription URLs, server secrets, access tokens, and generated configs from this report.
          required: true
